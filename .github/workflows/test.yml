name: Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django }}, django CMS ${{ matrix.cms }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", django: "4.2", cms: "3.11" }
          - { python-version: "3.10", django: "4.2", cms: "4.1" }
          - { python-version: "3.12", django: "5.2", cms: "4.1" }
          - { python-version: "3.12", django: "5.2", cms: "5.0" }
          - { python-version: "3.13", django: "6.0", cms: "5.1" }
          - { python-version: "3.14", django: "6.1", cms: "5.1" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django~=${{ matrix.django }}.0" "django-cms~=${{ matrix.cms }}.0" -e ".[test]"
      - name: Run tests
        run: python -m pytest
